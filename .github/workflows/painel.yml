name: Atualizar painel

on:
  push:
    branches: [main]
  schedule:
    # De hora em hora, das 7h às 20h de Brasília (UTC-3), de segunda a sexta
    - cron: "5 10-23 * * 1-5"
    # Uma vez por dia no fim de semana
    - cron: "5 12 * * 0,6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: painel-pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Testes
        run: npm test

      - name: Coletar do Monday e gerar o painel criptografado
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4

  manter-agendamento:
    # O GitHub desliga agendamentos de repositórios públicos após 60 dias sem commits;
    # reativar o workflow pela API reinicia essa contagem.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Manter o agendamento ativo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/painel.yml/enable"
