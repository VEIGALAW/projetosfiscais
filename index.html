<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Projetos Fiscais · Painel executivo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%233C3C3C'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Helvetica Neue,Helvetica,Arial,sans-serif' font-size='24' font-weight='300' fill='%23CE5600'%3E%2B%3C/text%3E%3C/svg%3E">
  <style>:root {
  --laranja-partners: #ce5600; /* laranja "Partners" do manual da marca */
  color-scheme: light;
  --pagina: #ebebeb;
  --papel: #ffffff;
  --superficie-2: #f3f3f3;
  --superficie-3: #e2e2e2;
  --texto: #3c3c3c;
  --texto-2: #555555;
  --texto-3: #767676;
  --regua: #e2e2e2;
  --regua-forte: #3c3c3c;
  --marinho: #3c3c3c;
  --acento: #3c3c3c;
  --acento-fundo: #ebebeb;
  --grafismo: #e2e2e2;
  --ok: #2e7d4f;
  --alerta: #a86a00;
  --critico: #b42318;
  --neutro: #9d9d9d;
  --ok-fundo: #e8f1eb;
  --alerta-fundo: #f5ecdc;
  --critico-fundo: #f7e5e3;
  --neutro-fundo: #ebebeb;
  --pendente: #e2e2e2;
  --feito: #9d9d9d;
  --andamento: #3c3c3c;
  --veu: rgba(60, 60, 60, 0.4);
  --sombra-alta: -12px 0 40px -16px rgba(0, 0, 0, 0.3);
  --titulo: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --fonte: "Helvetica Neue", Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --pagina: #000000;
    --papel: #1c1c1c;
    --superficie-2: #262626;
    --superficie-3: #303030;
    --texto: #ebebeb;
    --texto-2: #cecece;
    --texto-3: #9d9d9d;
    --regua: #363636;
    --regua-forte: #ebebeb;
    --marinho: #ebebeb;
    --acento: #ebebeb;
    --acento-fundo: #303030;
    --grafismo: #2a2a2a;
    --ok: #5cbf85;
    --alerta: #e0a63a;
    --critico: #f0645a;
    --neutro: #9d9d9d;
    --ok-fundo: #1c2f24;
    --alerta-fundo: #332a17;
    --critico-fundo: #3a2220;
    --neutro-fundo: #303030;
    --pendente: #363636;
    --feito: #9d9d9d;
    --andamento: #ebebeb;
    --veu: rgba(0, 0, 0, 0.65);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --pagina: #000000;
  --papel: #1c1c1c;
  --superficie-2: #262626;
  --superficie-3: #303030;
  --texto: #ebebeb;
  --texto-2: #cecece;
  --texto-3: #9d9d9d;
  --regua: #363636;
  --regua-forte: #ebebeb;
  --marinho: #ebebeb;
  --acento: #ebebeb;
  --acento-fundo: #303030;
  --grafismo: #2a2a2a;
  --ok: #5cbf85;
  --alerta: #e0a63a;
  --critico: #f0645a;
  --neutro: #9d9d9d;
  --ok-fundo: #1c2f24;
  --alerta-fundo: #332a17;
  --critico-fundo: #3a2220;
  --neutro-fundo: #303030;
  --pendente: #363636;
  --feito: #9d9d9d;
  --andamento: #ebebeb;
  --veu: rgba(0, 0, 0, 0.65);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--pagina);
  color: var(--texto);
  font-family: var(--fonte);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body.com-gaveta { overflow: hidden; }

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--texto); text-decoration-color: var(--acento); }
a:hover { color: var(--acento); }
svg { flex: none; }
h1, h2, h3, h4 { font-family: var(--titulo); font-weight: 300; letter-spacing: -0.01em; }

.oculto-visual {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.num { font-variant-numeric: tabular-nums; }
.leve { font-family: var(--titulo); font-weight: 300; }
.meta { color: var(--texto-3); font-size: 12.5px; }
.rotulo {
  font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--texto-3);
}

:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

/* ---------- Folha ---------- */

.folha { max-width: 1320px; margin: 0 auto; background: var(--papel); min-height: 100vh; }
.topo-barra, .heroi, main { padding-left: 56px; padding-right: 56px; }

/* ---------- Status ---------- */

.icone-status { width: 13px; height: 13px; }
.st-critico .icone-status { color: var(--critico); }
.st-atencao .icone-status { color: var(--alerta); }
.st-em_dia .icone-status { color: var(--ok); }
.st-concluido .icone-status { color: var(--neutro); }

.pilula {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; white-space: nowrap; letter-spacing: 0.02em;
}
.pilula.st-critico { color: var(--critico); }
.pilula.st-atencao { color: var(--alerta); }
.pilula.st-em_dia { color: var(--ok); }
.pilula.st-concluido { color: var(--texto-3); }

.selo-dias { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.selo-dias .sep { color: var(--texto-3); font-weight: 400; }
.selo-dias b { font-weight: 600; }
.selo-dias small { font-size: 12px; font-weight: 400; color: var(--texto-3); }
.selo-dias.st-critico { color: var(--critico); }
.selo-dias.st-atencao { color: var(--alerta); }
.selo-dias.st-em_dia { color: var(--ok); }
.selo-dias.st-concluido { color: var(--texto-3); }

.etiqueta {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 500; color: var(--texto-2); white-space: nowrap;
}
.etiqueta .ponto { width: 7px; height: 7px; border-radius: 50%; background: var(--texto-3); }
.etiqueta.e-andamento .ponto { background: var(--andamento); }
.etiqueta.e-parado .ponto { background: var(--critico); }
.etiqueta.e-pendente .ponto { background: transparent; border: 1.5px solid var(--texto-3); }
.etiqueta + .etiqueta::before { content: "·"; color: var(--texto-3); margin-right: 2px; }

.avatar {
  display: inline-grid; place-items: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--cor, #6b7385); color: #fff;
  font-size: 10px; font-weight: 600; letter-spacing: 0.03em;
  border: 2px solid var(--papel);
}
.avatar.mini { width: 20px; height: 20px; font-size: 9px; border-width: 0; }
.avatar.mais { background: var(--superficie-3); color: var(--texto-2); }
.avatar.vazio { background: var(--critico-fundo); color: var(--critico); }
.avatar.vazio svg { width: 13px; height: 13px; }
.avatares { display: inline-flex; }
.avatares .avatar + .avatar { margin-left: -7px; }
.sem-dono { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; color: var(--critico); font-weight: 600; font-size: 12px; }
.sem-dono svg { width: 13px; height: 13px; }
.pessoa-inline { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; font-size: 13px; }
.nomes { color: var(--texto-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ---------- Acesso ---------- */

.acesso {
  min-height: 100vh;
  display: grid; grid-template-columns: 1.1fr 1fr;
  background: var(--papel);
}
.acesso-lado {
  background: #ebebeb; color: #3c3c3c; position: relative; overflow: hidden;
  padding: 56px; display: flex; flex-direction: column; justify-content: center; gap: 16px;
}
.acesso-marca { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: 0.02em; font-size: 15px; color: #000; }
.acesso-lado::after, .heroi::after { content: "+"; position: absolute; font-weight: 300; line-height: 1; color: var(--laranja-partners); pointer-events: none; z-index: 0; }
.acesso-lado::after { font-size: 520px; right: -90px; bottom: -150px; }
.acesso-lado > * { position: relative; z-index: 1; }
.acesso-marca .selo { display: none; }
.acesso-lado h1 { font-size: 52px; line-height: 1.05; font-weight: 300; margin: 24px 0 0; }
.acesso-lado p { max-width: 440px; color: #555555; font-size: 16px; margin: 0; }
.acesso-cartao { align-self: center; justify-self: center; width: min(400px, calc(100% - 32px)); padding: 32px 0; }
.acesso-cartao h2 { font-size: 28px; font-weight: 300; margin: 0; }
.acesso-sub { color: var(--texto-3); margin: 4px 0 24px; }
.campo { display: grid; gap: 6px; margin-bottom: 14px; }
.campo label { font-size: 13px; font-weight: 600; color: var(--texto-2); }
.campo input {
  width: 100%; padding: 12px 14px; font-size: 15px;
  border: 1px solid var(--regua); border-bottom-color: var(--regua-forte); border-radius: 0; background: var(--papel);
}
.campo input:focus { border-color: var(--acento); outline: none; }
.lembrar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto-2); margin-bottom: 18px; }
.botao {
  width: 100%; border: 0; border-radius: 0; padding: 13px 16px; font-weight: 500; font-size: 14px;
  background: #3c3c3c; color: #fff; transition: background 0.15s;
}
.botao:hover { opacity: 0.9; }
.botao[disabled] { opacity: 0.7; cursor: progress; }
.erro { color: var(--critico); font-size: 13px; min-height: 20px; margin: 10px 0 0; }
.acesso-rodape { display: flex; align-items: center; gap: 6px; margin-top: 20px; font-size: 12px; color: var(--texto-3); }
.acesso-rodape svg { width: 14px; height: 14px; }

/* ---------- Cabeçalho ---------- */

.topo-barra {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding-top: 26px; padding-bottom: 22px; border-bottom: 1px solid var(--regua-forte);
}
.marca { display: flex; align-items: center; gap: 14px; }
.marca .selo { display: none; }
.marca .mais-selo { color: var(--laranja-partners); font-weight: 300; font-size: 22px; line-height: 1; margin-right: -4px; }
.marca strong { display: block; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; color: var(--texto); }
.marca span { display: block; font-size: 12.5px; color: var(--texto-3); }
.topo-acoes { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--texto-3); }
.atualizado { display: inline-flex; align-items: center; gap: 6px; }
.atualizado svg { width: 14px; height: 14px; }
.icone-botao {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 0; border-bottom: 1px solid var(--regua); color: var(--texto);
  padding: 2px 0; font-size: 12.5px; font-weight: 500;
}
.icone-botao:hover { border-bottom-color: var(--texto); }
.icone-botao svg { width: 14px; height: 14px; }

.heroi { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 56px; align-items: end; padding-top: 56px; position: relative; overflow: hidden; }
.heroi::after { font-size: 300px; right: 40px; top: -70px; }
.heroi > * { position: relative; z-index: 1; }
.sobretitulo { margin: 0 0 18px; color: var(--texto-3); font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
.heroi h1 { margin: 0; font-size: clamp(32px, 4vw, 54px); line-height: 1.08; letter-spacing: -0.02em; font-weight: 300; max-width: 820px; text-wrap: pretty; }
.heroi h1 em { font-style: normal; font-weight: 700; }
.heroi-sub { margin: 22px 0 0; color: var(--texto-2); font-size: 17px; line-height: 1.5; max-width: 640px; text-wrap: pretty; }
.heroi-sub strong { color: var(--texto); font-weight: 600; }

.carteira { border-top: 1px solid var(--regua-forte); padding-top: 14px; display: grid; gap: 10px; }
.carteira-topo { display: flex; justify-content: space-between; align-items: baseline; }
.carteira-topo b { font-family: var(--titulo); font-size: 22px; font-weight: 300; }
.carteira-barra { display: flex; height: 10px; gap: 2px; }
.carteira-barra span { display: block; min-width: 3px; }
.carteira-barra .critico { background: var(--critico); }
.carteira-barra .atencao { background: var(--alerta); }
.carteira-barra .em_dia { background: var(--ok); }
.carteira-legenda { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--texto-2); }
.carteira-legenda span { display: inline-flex; align-items: center; gap: 6px; }
.carteira-legenda b { font-weight: 600; color: var(--texto); }

.kpis {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  margin: 44px 56px 0; border-top: 1px solid var(--regua-forte); border-bottom: 1px solid var(--regua);
}
.kpi {
  text-align: left; display: grid; gap: 2px; align-content: start;
  padding: 22px 20px; background: none; border: 0; border-right: 1px solid var(--regua);
  color: var(--texto); transition: background 0.15s;
}
.kpi:first-child { padding-left: 0; }
.kpi:last-child { border-right: 0; padding-right: 0; }
.kpi:not([disabled]):hover { background: var(--superficie-2); }
.kpi[aria-pressed="true"] { box-shadow: inset 0 3px 0 var(--texto); background: var(--superficie-2); }
.kpi[disabled] { cursor: default; }
.kpi-valor { font-family: var(--titulo); font-size: 52px; font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
.kpi.st-critico .kpi-valor { color: var(--critico); }
.kpi.st-concluido .kpi-valor { color: var(--texto-3); }
.kpi-rotulo { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; margin-top: 10px; }
.kpi-nota { font-size: 12px; color: var(--texto-3); }

/* ---------- Conteúdo ---------- */

main { padding-top: 8px; padding-bottom: 64px; }

.aviso {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--alerta-fundo); border-left: 3px solid var(--alerta);
  padding: 12px 16px; margin-top: 24px; font-size: 13.5px;
}
.aviso svg { width: 18px; height: 18px; color: var(--alerta); margin-top: 1px; }

.secao { margin-top: 52px; }
.secao-cabecalho, .bloco-cabecalho { display: flex; align-items: baseline; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 20px; }
.secao-cabecalho > div, .bloco-cabecalho > div { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.secao-cabecalho h2, .bloco-cabecalho h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
.secao-cabecalho p, .bloco-cabecalho p { margin: 0; color: var(--texto-3); font-size: 12.5px; }
.resumo-filtro { font-size: 12.5px; color: var(--texto-2); margin: 0; border-bottom: 1px solid var(--acento); padding-bottom: 2px; }
.resumo-filtro button { background: none; border: 0; padding: 0; color: var(--acento); font-weight: 600; text-decoration: underline; }

/* Esteira */
.esteira {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr);
  gap: 28px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity;
}
.coluna-fase { min-width: 0; scroll-snap-align: start; }
.coluna-fase > header {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding-bottom: 8px; border-bottom: 2px solid var(--regua-forte);
}
.fase-num { font-size: 12px; font-weight: 400; color: var(--texto-3); margin-right: 8px; }
.coluna-fase h3 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0; display: inline; }
.coluna-fase header span.conta { font-size: 12.5px; color: var(--texto-3); white-space: nowrap; }
.cards { display: grid; grid-template-columns: minmax(0, 1fr); }
.coluna-vazia { margin: 0; padding: 16px 0; font-size: 12.5px; color: var(--texto-3); font-style: italic; }

.card {
  display: grid; gap: 4px; width: 100%; min-width: 0; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--regua);
  padding: 14px 0 12px; color: var(--texto); transition: background 0.15s;
}
.card:hover { background: var(--superficie-2); box-shadow: -8px 0 0 var(--superficie-2), 8px 0 0 var(--superficie-2); }
.marca-parado { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--critico); }
.card-empresa { font-weight: 600; font-size: 14px; line-height: 1.3; }
.card-etapa { font-size: 12.5px; color: var(--texto-2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-rodape { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; min-width: 0; flex-wrap: wrap; }
.card-rodape .nomes { flex: 1 1 0; min-width: 0; }
.card-rodape .selo-dias { flex: none; }

/* Blocos */
.grade-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; margin-top: 56px; }
.painel-bloco { min-width: 0; }

.ranking { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--regua); }
.ranking li { border-bottom: 1px solid var(--regua); }
.ranking-linha {
  width: 100%; display: grid; align-items: center; gap: 16px;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  background: none; border: 0; text-align: left; padding: 12px 0; color: var(--texto);
}
.ranking-linha:hover { background: var(--superficie-2); box-shadow: -8px 0 0 var(--superficie-2), 8px 0 0 var(--superficie-2); }
.posicao { font-size: 12.5px; color: var(--texto-3); }
.ranking-nome { min-width: 0; }
.ranking-nome strong { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranking-nome span { display: block; font-size: 12px; color: var(--texto-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranking-dias { font-family: var(--titulo); font-weight: 300; font-size: 30px; line-height: 1; text-align: right; white-space: nowrap; }
.ranking-dias.st-critico { color: var(--critico); }
.ranking-dias.st-atencao { color: var(--alerta); }
.ranking-dias.st-em_dia { color: var(--ok); }
.ranking-dias small { font-family: var(--fonte); font-size: 12px; color: var(--texto-3); font-weight: 400; margin-left: 5px; }

.pessoas { display: grid; gap: 2px; }
.pessoa-linha {
  width: 100%; display: grid; align-items: center; gap: 16px;
  grid-template-columns: minmax(110px, 150px) minmax(0, 1fr) 32px;
  background: none; border: 0; text-align: left; padding: 9px 0; color: var(--texto);
}
.pessoa-linha:hover, .pessoa-linha[aria-pressed="true"] { background: var(--superficie-2); box-shadow: -8px 0 0 var(--superficie-2), 8px 0 0 var(--superficie-2); }
.pessoa-linha[aria-pressed="true"] .pessoa-nome { color: var(--acento); }
.pessoa-linha.sem .pessoa-nome, .pessoa-linha.sem .pessoa-total { color: var(--critico); }
.pessoa-nome { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pessoa-barra { display: flex; gap: 2px; height: 12px; width: var(--largura); min-width: 6px; }
.pessoa-barra .seg { height: 100%; min-width: 3px; }
.seg.critico { background: var(--critico); }
.seg.atencao { background: var(--alerta); }
.seg.em_dia { background: var(--ok); }
.pessoa-total { font-family: var(--titulo); font-size: 20px; font-weight: 300; text-align: right; }

.legenda { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--regua); font-size: 12px; color: var(--texto-2); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }

.colunas { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; align-items: end; height: 170px; border-bottom: 1px solid var(--regua-forte); }
.coluna { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; height: 100%; gap: 6px; }
.coluna-valor { font-size: 13px; font-weight: 700; color: var(--texto-2); align-self: end; }
.coluna-barra { width: min(28px, 70%); background: var(--acento); align-self: end; }
.coluna:not(:has(.coluna-valor)) { grid-template-rows: 1fr auto; }
.coluna-rotulo { font-size: 11px; color: var(--texto-3); white-space: nowrap; width: 100%; text-align: center; padding: 6px 0 8px; }

.como-ler dl { margin: 0; display: grid; gap: 14px; border-top: 1px solid var(--regua); padding-top: 14px; }
.como-ler dt { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--texto-3); }
.como-ler dd { margin: 4px 0 0; font-size: 13.5px; color: var(--texto-2); }
.como-ler dd span { display: inline-flex; vertical-align: -2px; }

/* Lista completa */
.lista-cartao { border-top: 1px solid var(--regua-forte); }
.filtros { display: flex; gap: 12px 20px; flex-wrap: wrap; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--regua); }
.busca { position: relative; flex: 1 1 240px; min-width: 200px; }
.busca svg { position: absolute; left: 0; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--texto-3); }
.busca input { width: 100%; padding: 8px 0 8px 26px; border: 0; border-bottom: 1px solid var(--regua); background: transparent; }
.busca input:focus { outline: none; border-bottom-color: var(--acento); }
.chips { display: flex; gap: 2px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 10px; font-size: 12.5px; font-weight: 500; color: var(--texto-3); border-bottom: 2px solid transparent; }
.chip:hover { color: var(--texto); }
.chip[aria-pressed="true"] { color: var(--texto); border-bottom-color: var(--acento); }
.chip .qtd { font-weight: 700; }
.selects { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.selects select { padding: 7px 8px; border: 1px solid var(--regua); border-radius: 0; background: var(--papel); max-width: 210px; color: var(--texto); }
.limpar { background: none; border: 0; color: var(--acento); font-size: 12.5px; font-weight: 600; padding: 6px; text-decoration: underline; }

.lista-cabecalho, .linha {
  display: grid; align-items: center; gap: 16px;
  grid-template-columns: minmax(150px, 1.2fr) minmax(190px, 1.6fr) 96px 132px minmax(150px, 1.2fr) 104px 96px;
  padding: 14px 0;
}
.lista-cabecalho { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--texto-3); border-bottom: 1px solid var(--regua); padding: 10px 0; }
.lista-cabecalho button { all: unset; cursor: pointer; }
.lista-cabecalho button:hover { color: var(--texto); }
.lista-cabecalho [aria-sort="descending"]::after { content: " ↓"; }
.lista-cabecalho [aria-sort="ascending"]::after { content: " ↑"; }
.linha { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--regua); text-align: left; color: var(--texto); }
.linha:hover { background: var(--superficie-2); box-shadow: -8px 0 0 var(--superficie-2), 8px 0 0 var(--superficie-2); }
.c-empresa strong { display: block; font-size: 14px; font-weight: 600; }
.c-empresa .meta, .c-entrada .meta { display: block; }
.c-etapa .nome-etapa { display: block; font-weight: 500; font-size: 13.5px; overflow-wrap: anywhere; }
.etiquetas { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.c-proximo { font-size: 13px; color: var(--texto-2); overflow-wrap: anywhere; }
.c-entrada { font-size: 13px; }
.rot-mobile { display: none; }
.medidor { display: grid; gap: 4px; }
.medidor-trilho { display: block; height: 4px; background: var(--pendente); overflow: hidden; }
.medidor-preenchido { display: block; height: 100%; background: var(--feito); }
.medidor .num { font-size: 12px; color: var(--texto-3); }
.vazio { padding: 32px 16px; text-align: center; color: var(--texto-3); font-style: italic; }

.rodape { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--regua); font-size: 12px; color: var(--texto-3); }

/* ---------- Gaveta de detalhes ---------- */

.camada { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
.camada:empty { display: none; }
.veu { position: absolute; inset: 0; background: var(--veu); opacity: 0; transition: opacity 0.2s; }
.gaveta {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(620px, 100%);
  background: var(--papel); box-shadow: var(--sombra-alta); border-left: 1px solid var(--regua);
  display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.25s ease;
}
.camada.visivel { pointer-events: auto; }
.camada.visivel .veu { opacity: 1; }
.camada.visivel .gaveta { transform: none; }
.gaveta-topo {
  display: flex; justify-content: space-between; gap: 16px; padding: 28px 32px 22px;
  border-bottom: 1px solid var(--regua-forte);
}
.gaveta-topo h2 { margin: 12px 0 6px; font-size: 32px; line-height: 1.1; font-weight: 300; }
.gaveta-topo p { margin: 0; color: var(--texto-3); font-size: 13px; }
.fechar { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--regua); background: none; color: var(--texto); flex: none; }
.fechar:hover { border-color: var(--acento); color: var(--acento); }
.fechar svg { width: 16px; height: 16px; }
.gaveta-corpo { flex: 1; overflow-y: auto; padding: 24px 32px 40px; display: grid; gap: 22px; align-content: start; }
.resumo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-bottom: 1px solid var(--regua); }
.resumo > div { padding: 0 16px 16px 0; border-right: 1px solid var(--regua); }
.resumo > div + div { padding-left: 16px; }
.resumo > div:last-child { border-right: 0; padding-right: 0; }
.resumo span { display: block; font-size: 11px; color: var(--texto-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 4px; }
.resumo strong { font-family: var(--titulo); font-weight: 300; font-size: 28px; line-height: 1; }
.resumo .st-critico strong { color: var(--critico); }
.alertas { display: grid; gap: 6px; }
.alertas span { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto-2); border-left: 3px solid var(--critico); padding: 6px 12px; }
.alertas svg { width: 15px; height: 15px; color: var(--critico); }

.frente { display: grid; gap: 14px; }
.frente + .frente { border-top: 1px solid var(--regua); padding-top: 22px; }
.frente-cabecalho { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.frente-cabecalho h4 { margin: 0; font-size: 16px; font-weight: 700; }
.trilha-rotulo { display: flex; justify-content: space-between; font-size: 11px; color: var(--texto-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: -6px; }
.trilha { display: flex; flex-wrap: wrap; gap: 3px; }
.passo { flex: 1 0 14px; max-width: 34px; height: 6px; background: var(--pendente); }
.passo.feito { background: var(--feito); }
.passo.andamento { background: var(--andamento); }
.passo.parado { background: var(--critico); }
.passo.atual { outline: 2px solid var(--texto); outline-offset: 1px; }
.etapa-atual { border-left: 3px solid var(--regua-forte); padding: 4px 0 4px 16px; display: grid; gap: 6px; }
.etapa-atual-topo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.etapa-atual-topo strong { font-weight: 700; font-size: 16px; line-height: 1.3; }
.etapa-atual .meta { margin: 0; }
.pessoas-inline { display: flex; flex-wrap: wrap; gap: 4px 0; }
.comentario { margin: 0; padding: 4px 0 4px 16px; border-left: 3px solid var(--neutro); }
.comentario p { margin: 0; font-size: 15px; font-weight: 300; font-style: italic; color: var(--texto-2); line-height: 1.45; }
.comentario footer { margin-top: 6px; font-size: 12px; color: var(--texto-3); }
.subtarefas h5, .outras h5 { margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--texto-3); }
.subtarefas ul, .outras ul { margin: 0; padding: 0; list-style: none; display: grid; }
.subtarefas li, .outras li { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--regua); }
.subtarefas li .meta, .outras li .meta { text-align: right; flex: none; max-width: 50%; }
.proximo { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: var(--superficie-2); }
.proximo svg { width: 16px; height: 16px; color: var(--texto); margin-top: 2px; }
.proximo div { display: grid; }
.proximo strong { font-size: 14px; font-weight: 600; }
.concluidas { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--texto-3); margin: 0; }
.concluidas svg { width: 14px; height: 14px; color: var(--neutro); }
.botao-monday { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; background: none; border: 1px solid var(--regua-forte); font-weight: 600; text-decoration: none; color: var(--texto); letter-spacing: 0.02em; }
.botao-monday:hover { border-color: var(--acento); color: var(--acento); }
.botao-monday svg { width: 14px; height: 14px; }

/* ---------- Dica ---------- */

#dica {
  position: fixed; z-index: 60; pointer-events: none; max-width: 300px;
  background: #3c3c3c; color: #fff; font-size: 12.5px; line-height: 1.4;
  padding: 7px 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}

/* ---------- Responsivo ---------- */

@media (max-width: 1180px) {
  .heroi { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .carteira { max-width: 420px; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 0; }
  .kpi { border-bottom: 1px solid var(--regua); }
  .kpi:first-child { padding-left: 20px; }
  .kpi:last-child { padding-right: 20px; }
  .kpi:nth-child(3n) { border-right: 0; }
  .lista-cabecalho { display: none; }
  .linha {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "empresa parado" "etapa etapa" "quem progresso" "proximo proximo" "entrada entrada";
    gap: 8px 16px; padding: 16px 0;
  }
  .c-empresa { grid-area: empresa; } .c-parado { grid-area: parado; justify-self: end; }
  .c-etapa { grid-area: etapa; } .c-quem { grid-area: quem; } .c-progresso { grid-area: progresso; min-width: 110px; }
  .c-proximo { grid-area: proximo; } .c-entrada { grid-area: entrada; display: flex; gap: 6px; align-items: baseline; }
  .c-entrada .meta { display: inline; }
  .rot-mobile { display: inline; color: var(--texto-3); font-size: 12px; font-weight: 600; margin-right: 4px; }
}

@media (max-width: 900px) {
  .topo-barra, .heroi, main { padding-left: 32px; padding-right: 32px; }
  .kpis { margin-left: 32px; margin-right: 32px; }
  .grade-2 { grid-template-columns: minmax(0, 1fr); gap: 48px; }
  .acesso { grid-template-columns: minmax(0, 1fr); }
  .acesso-lado { padding: 40px 24px; }
  .acesso-lado h1 { font-size: 40px; margin-top: 12px; }
}

@media (max-width: 640px) {
  .heroi::after { font-size: 180px; right: -10px; top: -40px; }
  .topo-barra, .heroi, main { padding-left: 20px; padding-right: 20px; }
  .topo-barra { padding-top: 18px; padding-bottom: 16px; }
  .heroi { padding-top: 32px; }
  .heroi h1 { font-size: 34px; }
  .heroi-sub { font-size: 15px; margin-top: 14px; }
  .kpis { margin: 28px 20px 0; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { padding: 16px 14px; }
  .kpi:first-child { padding-left: 14px; }
  .kpi:nth-child(3n) { border-right: 1px solid var(--regua); }
  .kpi:nth-child(2n) { border-right: 0; }
  .kpi:last-child { border-right: 0; }
  .kpi-valor { font-size: 40px; }
  .secao { margin-top: 40px; }
  .secao-cabecalho h2, .bloco-cabecalho h2 { font-size: 18px; }
  .esteira { grid-auto-columns: 84%; margin: 0 -20px; padding: 0 20px 6px; gap: 20px; }
  .grade-2 { margin-top: 40px; gap: 40px; }
  .ranking-dias { font-size: 24px; }
  .pessoa-linha { grid-template-columns: minmax(0, 1fr) 90px 28px; }
  .selects select { max-width: none; flex: 1 1 140px; }
  .gaveta-topo, .gaveta-corpo { padding-left: 20px; padding-right: 20px; }
  .gaveta-topo h2 { font-size: 28px; }
  .resumo strong { font-size: 22px; }
}

@media (forced-colors: active) {
  .seg, .passo, .coluna-barra, .medidor-preenchido, .carteira-barra span { forced-color-adjust: none; }
}

@media print {
  .topo-acoes, .filtros, .camada { display: none !important; }
  .folha { max-width: none; }
}
</style>

  <script>(() => {
  'use strict';

  const CHAVE_SENHA = 'painel-fiscal:senha';
  const CHAVE_TEMA = 'painel-fiscal:tema';
  const FUSO = 'America/Sao_Paulo';

  const app = document.getElementById('app');
  const dica = document.getElementById('dica');

  // ---------- Armazenamento (pode não existir em janelas privadas) ----------

  const guardar = {
    ler(tipo, chave) {
      try { return window[tipo].getItem(chave); } catch { return null; }
    },
    gravar(tipo, chave, valor) {
      try { window[tipo].setItem(chave, valor); } catch { /* sem armazenamento */ }
    },
    remover(tipo, chave) {
      try { window[tipo].removeItem(chave); } catch { /* sem armazenamento */ }
    },
  };

  // ---------- Utilidades ----------

  const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESCAPES[c]);
  const normalizar = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  const fmtData = new Intl.DateTimeFormat('pt-BR', { timeZone: FUSO, day: '2-digit', month: '2-digit', year: 'numeric' });
  const fmtDataCurta = new Intl.DateTimeFormat('pt-BR', { timeZone: FUSO, day: '2-digit', month: 'short' });
  const fmtHora = new Intl.DateTimeFormat('pt-BR', { timeZone: FUSO, hour: '2-digit', minute: '2-digit' });
  const fmtChaveMes = new Intl.DateTimeFormat('en-CA', { timeZone: FUSO, year: 'numeric', month: '2-digit' });
  const fmtDiaSemana = new Intl.DateTimeFormat('pt-BR', { timeZone: FUSO, weekday: 'long', day: 'numeric', month: 'long' });
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  const data = (iso) => (iso ? fmtData.format(new Date(iso)) : '—');
  const dataCurta = (iso) => (iso ? fmtDataCurta.format(new Date(iso)).replace('.', '') : '—');
  const dias = (n) => (n == null ? '—' : n === 1 ? '1 dia' : `${n} dias`);
  const ha = (n) => (n == null ? '' : n === 0 ? 'hoje' : `há ${dias(n)}`);
  const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

  const capitalizar = (p) => (p.length > 2 && p === p.toUpperCase() ? p[0] + p.slice(1).toLowerCase() : p);
  const nomeCurto = (nome) => {
    const partes = String(nome).split(/\s+/).filter(Boolean).map(capitalizar);
    return partes.length <= 2 ? partes.join(' ') : `${partes[0]} ${partes[partes.length - 1]}`;
  };
  const iniciais = (nome) => {
    const partes = nomeCurto(nome).split(' ');
    return ((partes[0]?.[0] ?? '') + (partes.length > 1 ? partes[partes.length - 1][0] : '')).toUpperCase();
  };

  const mediana = (valores) => {
    const v = valores.filter((x) => x != null).sort((a, b) => a - b);
    if (!v.length) return null;
    const m = Math.floor(v.length / 2);
    return v.length % 2 ? v[m] : Math.round((v[m - 1] + v[m]) / 2);
  };

  // ---------- Ícones ----------

  const svg = (conteudo, classe = '') =>
    `<svg class="${classe}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${conteudo}</svg>`;

  const ICONES = {
    critico: svg('<circle cx="8" cy="8" r="6.5" fill="currentColor" stroke="none"/><path d="M8 4.6v4" stroke="#fff"/><circle cx="8" cy="11.2" r=".4" fill="#fff" stroke="#fff"/>', 'icone-status'),
    atencao: svg('<path d="M8 1.8 15 14H1z" fill="currentColor" stroke="currentColor" stroke-width="1.2"/><path d="M8 6.2v3.4" stroke="#1a1a19"/><circle cx="8" cy="11.8" r=".35" fill="#1a1a19" stroke="#1a1a19"/>', 'icone-status'),
    em_dia: svg('<circle cx="8" cy="8" r="6.5" fill="currentColor" stroke="none"/><path d="m5.2 8.2 1.9 1.9 3.8-3.9" stroke="#fff"/>', 'icone-status'),
    concluido: svg('<rect x="1.8" y="1.8" width="12.4" height="12.4" rx="3" fill="currentColor" stroke="none"/><path d="m5.2 8.2 1.9 1.9 3.8-3.9" stroke="#fff"/>', 'icone-status'),
    busca: svg('<circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/>'),
    tema: svg('<circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor"/>'),
    sair: svg('<rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>'),
    externo: svg('<path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V13H3V5h3.5"/>'),
    aviso: svg('<path d="M8 1.8 15 14H1z"/><path d="M8 6.2v3.4M8 11.8v.1"/>'),
    pessoa: svg('<circle cx="8" cy="5.5" r="2.7"/><path d="M2.8 14a5.2 5.2 0 0 1 10.4 0"/>'),
    fechar: svg('<path d="m4 4 8 8M12 4l-8 8"/>'),
    seta: svg('<path d="M6 3.5 10.5 8 6 12.5"/>'),
    relogio: svg('<circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.6"/>'),
    alvo: svg('<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.5"/>'),
  };

  const SELO = '';
  const ROMANOS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];

  const STATUS = {
    critico: { rotulo: 'Crítico', ordem: 0 },
    atencao: { rotulo: 'Atenção', ordem: 1 },
    em_dia: { rotulo: 'Em dia', ordem: 2 },
    concluido: { rotulo: 'Concluído', ordem: 3 },
  };
  const ESTADOS = { andamento: 'Em andamento', parado: 'Parado', pendente: 'Aguardando início', feito: 'Feito' };

  // Cores fixas por pessoa (ordem alfabética), só para identificar avatares.
  const CORES_PESSOAS = ['#2a78d6', '#eb6834', '#1baf7a', '#9085e9', '#e87ba4', '#008300', '#4a3aa7', '#c98500'];
  const corDaPessoa = new Map();

  const pilula = (status) => `<span class="pilula st-${status}">${ICONES[status]}${STATUS[status].rotulo}</span>`;
  const etiquetaEstado = (estado) =>
    `<span class="etiqueta e-${estado}"><span class="ponto"></span>${ESTADOS[estado] ?? estado}</span>`;
  const avatar = (nome, tamanho = '') =>
    `<span class="avatar ${tamanho}" style="--cor:${corDaPessoa.get(nome) ?? '#6e6d67'}" data-dica="${esc(nome)}">${esc(iniciais(nome))}</span>`;
  const avatares = (nomes, max = 3) =>
    nomes.length
      ? `<span class="avatares">${nomes.slice(0, max).map((n) => avatar(n)).join('')}${nomes.length > max ? `<span class="avatar mais" data-dica="${esc(nomes.slice(max).join(', '))}">+${nomes.length - max}</span>` : ''}</span>`
      : `<span class="sem-dono" data-dica="Etapa sem responsável no Monday">${ICONES.pessoa}Sem dono</span>`;
  const listaPessoas = (nomes) =>
    nomes.length
      ? nomes.map((n) => `<span class="pessoa-inline">${avatar(n, 'mini')}${esc(nomeCurto(n))}</span>`).join('')
      : `<span class="sem-dono">${ICONES.pessoa}Sem responsável</span>`;
  const selo = (status, n, rotulo = STATUS[status].rotulo) =>
    `<span class="selo-dias st-${status}" data-dica="${STATUS[status].rotulo}${n != null ? ` · ${dias(n)} sem avanço` : ''}">${ICONES[status]}${rotulo}${n != null ? `<span class="sep">·</span><b class="num">${n}</b><small>${n === 1 ? 'dia' : 'dias'}</small>` : ''}</span>`;
  const nomesCurtos = (nomes, max = 2) =>
    nomes.length
      ? `<span class="nomes" data-dica="${esc(nomes.map(nomeCurto).join(', '))}">${esc(nomes.slice(0, max).map(nomeCurto).join(' · '))}${nomes.length > max ? ` +${nomes.length - max}` : ''}</span>`
      : `<span class="sem-dono" data-dica="Etapa sem responsável no Monday">${ICONES.pessoa}Sem responsável</span>`;

  // ---------- Estado da tela ----------

  const tela = {
    painel: null,
    criptografado: false,
    filtro: { status: 'ativos', busca: '', pessoa: '', fase: '', tipo: '' },
    ordem: { campo: 'parado', direcao: 'desc' },
    aberto: null,
  };

  const nomeDaFase = (id) => tela.painel.fases.find((f) => f.id === id)?.nome ?? 'Outras etapas';
  const projetoPorId = (id) => tela.painel.projetos.find((p) => p.id === id);
  const ativosDe = (projetos) => projetos.filter((p) => p.status !== 'concluido');

  function prepararProjetos(painel) {
    for (const p of painel.projetos) {
      p._principal = p.frentes.find((f) => f.id === p.frentePrincipal) ?? null;
      p._atual = p._principal?.atual ?? null;
      p._fase = p._atual?.fase ?? '';
      p._parado = p._atual?.diasParado ?? null;
      p._semDono = Boolean(p._atual && p._atual.responsaveis.length === 0);
      const pessoas = new Set();
      for (const f of p.frentes) for (const n of f.atual?.responsaveis ?? []) pessoas.add(n);
      p._pessoas = [...pessoas];
      p._busca = normalizar(
        [
          p.empresa, p.quadro, p.tipo,
          ...p.frentes.flatMap((f) => [f.nome, f.atual?.nome, f.proximo?.nome, ...(f.atual?.responsaveis ?? [])]),
        ].filter(Boolean).join(' '),
      );
    }
    const todas = [...new Set(painel.projetos.flatMap((p) => p.frentes.flatMap((f) => [...(f.atual?.responsaveis ?? []), ...(f.proximo?.responsaveis ?? [])])))]
      .sort((a, b) => a.localeCompare(b, 'pt-BR'));
    todas.forEach((n, i) => corDaPessoa.set(n, CORES_PESSOAS[i % CORES_PESSOAS.length]));
  }

  // ---------- Acesso com senha ----------

  const deBase64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function abrirDados(pacote, senha) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    const chave = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: deBase64(pacote.salt), iterations: pacote.iteracoes, hash: 'SHA-256' },
      base,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt'],
    );
    const aberto = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deBase64(pacote.iv) }, chave, deBase64(pacote.dados));
    return JSON.parse(new TextDecoder().decode(aberto));
  }

  function telaDeAcesso(pacote) {
    app.innerHTML = `
      <div class="acesso">
        <div class="acesso-lado">
          <div class="acesso-marca"><span>Veiga Partners</span></div>
          <h1>Projetos Fiscais</h1>
          <p>Visão executiva da carteira de levantamento de créditos: onde cada projeto está, quem está com ele e o que está parado.</p>
        </div>
        <form class="acesso-cartao" id="form-acesso" autocomplete="on">
          <h2>Acesso da diretoria</h2>
          <p class="acesso-sub">Digite a senha para abrir o painel.</p>
          <input type="text" name="username" value="diretoria" autocomplete="username" hidden>
          <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" name="password" type="password" autocomplete="current-password" required>
          </div>
          <label class="lembrar"><input type="checkbox" id="lembrar"> Lembrar neste dispositivo</label>
          <button class="botao" type="submit">Entrar</button>
          <p class="erro" id="erro-acesso" role="alert"></p>
          <p class="acesso-rodape">${ICONES.sair}Dados criptografados · acesso restrito</p>
        </form>
      </div>`;
    const form = document.getElementById('form-acesso');
    const campo = document.getElementById('senha');
    const erro = document.getElementById('erro-acesso');
    const botao = form.querySelector('button');
    campo.focus();

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      erro.textContent = '';
      botao.disabled = true;
      botao.textContent = 'Abrindo…';
      try {
        const painel = await abrirDados(pacote, campo.value);
        guardar.gravar('sessionStorage', CHAVE_SENHA, campo.value);
        if (document.getElementById('lembrar').checked) guardar.gravar('localStorage', CHAVE_SENHA, campo.value);
        iniciarPainel(painel);
      } catch {
        erro.textContent = window.isSecureContext === false
          ? 'Abra o painel pelo endereço https para usar a senha.'
          : 'Senha incorreta. Tente novamente.';
        botao.disabled = false;
        botao.textContent = 'Entrar';
        campo.select();
      }
    });
  }

  function sair() {
    guardar.remover('sessionStorage', CHAVE_SENHA);
    guardar.remover('localStorage', CHAVE_SENHA);
    location.reload();
  }

  // ---------- Tema ----------

  const TEMAS = ['auto', 'light', 'dark'];
  const NOME_TEMA = { auto: 'Automático', light: 'Claro', dark: 'Escuro' };

  function aplicarTema(tema) {
    if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
    else delete document.documentElement.dataset.theme;
  }
  const temaAtual = () => guardar.ler('localStorage', CHAVE_TEMA) || 'auto';

  // ---------- Filtros e ordenação ----------

  function filtrar(projetos) {
    const { status, busca, pessoa, fase, tipo } = tela.filtro;
    const termo = normalizar(busca).trim();
    return projetos.filter((p) => {
      if (status === 'ativos' && p.status === 'concluido') return false;
      if (status !== 'ativos' && status !== 'todos' && p.status !== status) return false;
      if (pessoa === '__sem__' ? !p._semDono : pessoa && !p._pessoas.includes(pessoa)) return false;
      if (fase && p._fase !== fase) return false;
      if (tipo && p.tipo !== tipo) return false;
      if (termo && !termo.split(/\s+/).every((t) => p._busca.includes(t))) return false;
      return true;
    });
  }

  const gravidade = (p) => (3 - STATUS[p.status].ordem) * 100000 + (p._parado ?? -1);

  function ordenar(projetos) {
    const { campo, direcao } = tela.ordem;
    const sinal = direcao === 'asc' ? 1 : -1;
    // Critérios em ordem crescente; "desc" inverte. Gravidade: status primeiro, depois dias parado.
    const criterios = {
      parado: (a, b) => gravidade(a) - gravidade(b),
      entrada: (a, b) => Date.parse(a.entrada) - Date.parse(b.entrada),
      empresa: (a, b) => a.empresa.localeCompare(b.empresa, 'pt-BR'),
      progresso: (a, b) => a.progresso.feitas / (a.progresso.total || 1) - b.progresso.feitas / (b.progresso.total || 1),
    };
    return [...projetos].sort((a, b) => sinal * criterios[campo](a, b) || a.empresa.localeCompare(b.empresa, 'pt-BR'));
  }

  const filtroAtivo = () => {
    const f = tela.filtro;
    return f.status !== 'ativos' || f.busca || f.pessoa || f.fase || f.tipo;
  };

  // ---------- Cabeçalho e resumo executivo ----------

  function kpis(painel) {
    const todos = painel.projetos;
    const ativos = ativosDe(todos);
    const contagem = { critico: 0, atencao: 0, em_dia: 0 };
    for (const p of ativos) contagem[p.status]++;
    const concluidos = todos.length - ativos.length;
    const semDono = ativos.filter((p) => p._semDono).length;
    const novos = todos.filter((p) => (p.diasDesdeEntrada ?? 999) <= 30).length;
    const { atencaoAposDias: at, criticoAposDias: cr } = painel.limites;
    const kpi = (valor, rotulo, nota, { acao, alvo, status, pressionado } = {}) => `
      <button type="button" class="kpi ${status ? `st-${status}` : ''}" ${acao ? `data-acao="${acao}" data-valor="${alvo}"` : 'disabled'} aria-pressed="${Boolean(pressionado)}">
        <span class="kpi-valor num">${valor}</span>
        <span class="kpi-rotulo">${status ? ICONES[status] : ''}${rotulo}</span>
        <span class="kpi-nota">${nota}</span>
      </button>`;
    const f = tela.filtro;

    return `
      <div class="kpis" id="kpis">
              ${kpi(contagem.critico, 'Críticos', `+${cr} dias ou “Parado”`, { acao: 'status', alvo: 'critico', status: 'critico', pressionado: f.status === 'critico' })}
              ${kpi(contagem.atencao, 'Atenção', `${at + 1} a ${cr} dias`, { acao: 'status', alvo: 'atencao', status: 'atencao', pressionado: f.status === 'atencao' })}
              ${kpi(contagem.em_dia, 'Em dia', `até ${at} dias`, { acao: 'status', alvo: 'em_dia', status: 'em_dia', pressionado: f.status === 'em_dia' })}
              ${kpi(semDono, 'Sem dono', 'etapa sem responsável', { acao: 'pessoa', alvo: '__sem__', pressionado: f.pessoa === '__sem__' })}
              ${kpi(concluidos, 'Concluídos', `${plural(novos, 'novo', 'novos')} em 30 dias`, { acao: 'status', alvo: 'concluido', status: 'concluido', pressionado: f.status === 'concluido' })}
            </div>
    `;
  }

  function cabecalho(painel) {
    const todos = painel.projetos;
    const ativos = ativosDe(todos);
    const contagem = { critico: 0, atencao: 0, em_dia: 0 };
    for (const p of ativos) contagem[p.status]++;
    const concluidos = todos.length - ativos.length;
    const semDono = ativos.filter((p) => p._semDono).length;
    const med = mediana(ativos.map((p) => p._parado));
    const novos = todos.filter((p) => (p.diasDesdeEntrada ?? 999) <= 30).length;
    const { atencaoAposDias: at, criticoAposDias: cr } = painel.limites;
    const gerado = new Date(painel.geradoEm);

    const pct = ativos.length ? Math.round((contagem.critico / ativos.length) * 100) : 0;
    const manchete = !ativos.length
      ? 'Nenhum projeto ativo no momento.'
      : contagem.critico === 0
        ? 'Carteira em dia: nenhum projeto parado há mais de ' + cr + ' dias.'
        : `<em>${contagem.critico} de ${ativos.length}</em> projetos estão parados há mais de ${cr} dias.`;

    const carteira = ativos.length
      ? `<div class="carteira" role="img" aria-label="${ativos.length} projetos ativos: ${['critico', 'atencao', 'em_dia'].map((s) => `${STATUS[s].rotulo} ${contagem[s]}`).join(', ')}">
            <div class="carteira-topo"><span class="rotulo">Carteira ativa</span><b class="num">${ativos.length}</b></div>
            <div class="carteira-barra">${['critico', 'atencao', 'em_dia'].filter((s) => contagem[s]).map((s) => `<span class="${s}" style="flex:${contagem[s]}" data-dica="${STATUS[s].rotulo}: ${plural(contagem[s], 'projeto', 'projetos')}"></span>`).join('')}</div>
            <div class="carteira-legenda">${['critico', 'atencao', 'em_dia'].map((s) => `<span class="st-${s}">${ICONES[s]}${STATUS[s].rotulo} <b class="num">${contagem[s]}</b></span>`).join('')}</div>
          </div>`
      : '';

    return `
      <header class="topo">
        <div class="topo-barra">
          <div class="marca"><span class="mais-selo" aria-hidden="true">+</span><div><strong>Veiga Partners</strong><span>Projetos Fiscais · Painel executivo</span></div></div>
          <div class="topo-acoes">
            <span class="atualizado">${ICONES.relogio}Atualizado ${fmtData.format(gerado)} às ${fmtHora.format(gerado)}</span>
            <button class="icone-botao" type="button" data-acao="tema">${ICONES.tema}<span>${NOME_TEMA[temaAtual()]}</span></button>
            ${tela.criptografado ? `<button class="icone-botao" type="button" data-acao="sair">${ICONES.sair}<span>Sair</span></button>` : ''}
          </div>
        </div>
        <div class="heroi">
          <div class="heroi-texto">
            <p class="sobretitulo">${esc(fmtDiaSemana.format(gerado))} · Situação da carteira</p>
            <h1>${manchete}</h1>
            <p class="heroi-sub">${ativos.length ? `${pct}% da carteira ativa está travada. O tempo típico sem avanço na etapa atual é de <strong>${dias(med)}</strong>${semDono ? ` e <strong>${plural(semDono, 'projeto está', 'projetos estão')} sem responsável</strong>` : ''}.` : ''}</p>
          </div>
          ${carteira}
        </div>
        ${kpis(painel)}
      </header>`;
  }

  function avisoDesatualizado(painel) {
    const horas = (Date.now() - Date.parse(painel.geradoEm)) / 3_600_000;
    const limite = painel.limites?.dadosDesatualizadosAposHoras ?? 30;
    if (horas <= limite) return '';
    return `<div class="aviso" role="status">${ICONES.aviso}<div><strong>Dados desatualizados.</strong>
      A última atualização foi em ${data(painel.geradoEm)} às ${fmtHora.format(new Date(painel.geradoEm))}. Verifique a atualização automática (aba Actions do GitHub).</div></div>`;
  }

  // ---------- Esteira por fase ----------

  function cartaoProjeto(p) {
    const a = p._atual;
    return `
      <button type="button" class="card st-${p.status}" data-acao="abrir" data-id="${esc(p.id)}">
        <span class="card-empresa">${esc(p.empresa)}</span>
        <span class="card-etapa" data-dica="${esc(a ? `${a.nome} · ${ESTADOS[a.estado]}` : 'Concluído')}">${esc(a?.nome ?? 'Concluído')}</span>
        <span class="card-rodape">
          ${a ? nomesCurtos(a.responsaveis) : '<span></span>'}
          ${selo(p.status, p._parado, a?.estado === 'parado' ? 'Parado' : STATUS[p.status].rotulo)}
        </span>
      </button>`;
  }

  function esteira(painel) {
    const visiveis = ativosDe(filtrar(painel.projetos));
    const colunas = painel.fases
      .map((f) => ({ ...f, projetos: ordenar(visiveis.filter((p) => p._fase === f.id)) }))
      .filter((c) => c.projetos.length || c.id !== 'outras');
    return `
      <div class="esteira" id="esteira">
        ${colunas
          .map((c, i) => {
            const criticos = c.projetos.filter((p) => p.status === 'critico').length;
            return `
            <section class="coluna-fase" aria-label="${esc(c.nome)}">
              <header>
                <div>${c.id === 'outras' ? '' : `<span class="fase-num">${ROMANOS[i] ?? i + 1}</span>`}<h3>${esc(c.nome)}</h3></div>
                <span class="conta num" data-dica="${plural(c.projetos.length, 'projeto', 'projetos')}${criticos ? ` · ${criticos} crítico${criticos > 1 ? 's' : ''}` : ''}">${c.projetos.length}${criticos ? ` <span class="st-critico">${ICONES.critico}${criticos}</span>` : ''}</span>
              </header>
              <div class="cards">${c.projetos.map(cartaoProjeto).join('') || '<p class="coluna-vazia">Nenhum projeto nesta fase</p>'}</div>
            </section>`;
          })
          .join('')}
      </div>`;
  }

  // ---------- Gargalos e pessoas ----------

  function gargalos(painel) {
    const lista = [...ativosDe(painel.projetos)].sort((a, b) => (b._parado ?? -1) - (a._parado ?? -1)).slice(0, 8);
    return `
      <section class="painel-bloco">
        <div class="bloco-cabecalho">
          <div><h2>Maiores gargalos</h2><p>Projetos há mais tempo sem avanço na etapa atual</p></div>
        </div>
        <ol class="ranking">
          ${lista
            .map(
              (p, i) => `
            <li>
              <button type="button" class="ranking-linha" data-acao="abrir" data-id="${esc(p.id)}">
                <span class="posicao num">${i + 1}</span>
                <span class="ranking-nome"><strong>${esc(p.empresa)}</strong><span>${esc(p._atual?.nome ?? '')}${p._atual ? ` · ${p._atual.responsaveis.length ? esc(p._atual.responsaveis.map(nomeCurto).join(', ')) : 'sem responsável'}` : ''}</span></span>
                <span class="ranking-dias num st-${p.status}">${p._parado ?? '—'}<small>dias</small></span>
              </button>
            </li>`,
            )
            .join('')}
        </ol>
      </section>`;
  }

  function pessoas(painel) {
    const ativos = ativosDe(painel.projetos);
    const nomes = [...new Set(ativos.flatMap((p) => p._pessoas))];
    const linhas = nomes
      .map((n) => {
        const doResp = ativos.filter((p) => p._pessoas.includes(n));
        const conta = { critico: 0, atencao: 0, em_dia: 0 };
        for (const p of doResp) conta[p.status]++;
        return { n, total: doResp.length, conta };
      })
      .sort((a, b) => b.total - a.total || b.conta.critico - a.conta.critico || a.n.localeCompare(b.n, 'pt-BR'));
    const maximo = Math.max(1, ...linhas.map((l) => l.total));
    const semDono = ativos.filter((p) => p._semDono).length;
    return `
      <section class="painel-bloco">
        <div class="bloco-cabecalho">
          <div><h2>Com quem estão os projetos</h2><p>Projetos ativos por responsável da etapa atual · clique para filtrar</p></div>
        </div>
        <div class="pessoas">
          ${linhas
            .map(
              (l) => `
            <button type="button" class="pessoa-linha" data-acao="pessoa" data-valor="${esc(l.n)}" aria-pressed="${tela.filtro.pessoa === l.n}">
              <span class="pessoa-nome">${esc(nomeCurto(l.n))}</span>
              <span class="pessoa-barra" style="--largura:${(l.total / maximo) * 100}%">
                ${['critico', 'atencao', 'em_dia'].filter((s) => l.conta[s]).map((s) => `<span class="seg ${s}" style="flex:${l.conta[s]}" data-dica="${esc(nomeCurto(l.n))} · ${STATUS[s].rotulo}: ${plural(l.conta[s], 'projeto', 'projetos')}"></span>`).join('')}
              </span>
              <span class="pessoa-total num">${l.total}</span>
            </button>`,
            )
            .join('')}
          ${semDono ? `<button type="button" class="pessoa-linha sem" data-acao="pessoa" data-valor="__sem__" aria-pressed="${tela.filtro.pessoa === '__sem__'}"><span class="pessoa-nome">Sem responsável</span><span class="pessoa-barra" style="--largura:${(semDono / maximo) * 100}%"><span class="seg critico" style="flex:1"></span></span><span class="pessoa-total num">${semDono}</span></button>` : ''}
        </div>
        <div class="legenda">${['critico', 'atencao', 'em_dia'].map((s) => `<span class="st-${s}">${ICONES[s]}${STATUS[s].rotulo}</span>`).join('')}</div>
      </section>`;
  }

  function entradasPorMes(painel) {
    const agora = new Date(painel.geradoEm);
    const meses = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(Date.UTC(agora.getUTCFullYear(), agora.getUTCMonth() - i, 15, 12));
      const chave = fmtChaveMes.format(d);
      meses.push({ chave, rotulo: `${MESES[Number(chave.slice(5, 7)) - 1]}/${chave.slice(2, 4)}`, projetos: [] });
    }
    for (const p of painel.projetos) {
      const m = meses.find((x) => x.chave === fmtChaveMes.format(new Date(p.entrada)));
      if (m) m.projetos.push(p.empresa);
    }
    const maximo = Math.max(1, ...meses.map((m) => m.projetos.length));
    const total = meses.reduce((s, m) => s + m.projetos.length, 0);
    return `
      <section class="painel-bloco">
        <div class="bloco-cabecalho">
          <div><h2>Entrada de projetos</h2><p>${plural(total, 'projeto iniciado', 'projetos iniciados')} nos últimos 12 meses</p></div>
        </div>
        <div class="colunas" role="img" aria-label="Entradas por mês: ${meses.map((m) => `${m.rotulo} ${m.projetos.length}`).join(', ')}">
          ${meses
            .map((m) => {
              const n = m.projetos.length;
              return `<div class="coluna" data-dica="${esc(`${m.rotulo} · ${plural(n, 'projeto', 'projetos')}${n ? `: ${m.projetos.join(', ')}` : ''}`)}">
                ${n ? `<span class="coluna-valor num">${n}</span>` : ''}
                <span class="coluna-barra" style="height:${(n / maximo) * 100}%"></span>
                <span class="coluna-rotulo">${esc(m.rotulo)}</span>
              </div>`;
            })
            .join('')}
        </div>
      </section>`;
  }

  function comoLer(painel) {
    const { atencaoAposDias: at, criticoAposDias: cr } = painel.limites;
    return `
      <section class="painel-bloco como-ler">
        <div class="bloco-cabecalho"><div><h2>Como ler</h2><p>Regras usadas nos números acima</p></div></div>
        <dl>
          <div><dt>Etapa atual</dt><dd>A marcada “Parado” ou, senão, a “Em andamento” mais avançada. Sem nenhuma em andamento, a próxima que ainda não começou.</dd></div>
          <div><dt>Dias parado</dt><dd>Desde a última atividade na etapa (status, subtarefa ou comentário no Monday).</dd></div>
          <div><dt>Semáforo</dt><dd><span class="st-critico">${ICONES.critico}</span> Crítico: +${cr} dias ou “Parado” · <span class="st-atencao">${ICONES.atencao}</span> Atenção: ${at + 1}–${cr} dias · <span class="st-em_dia">${ICONES.em_dia}</span> Em dia: até ${at} dias</dd></div>
          <div><dt>Entrada</dt><dd>Data de criação do quadro do cliente no Monday.</dd></div>
        </dl>
      </section>`;
  }

  // ---------- Lista completa ----------

  function barraDeFiltros(painel) {
    const conta = (s) => painel.projetos.filter((p) => p.status === s).length;
    const opcoesStatus = [
      ['ativos', 'Ativos', ativosDe(painel.projetos).length],
      ['critico', 'Críticos', conta('critico')],
      ['atencao', 'Atenção', conta('atencao')],
      ['em_dia', 'Em dia', conta('em_dia')],
      ['concluido', 'Concluídos', conta('concluido')],
      ['todos', 'Todos', painel.projetos.length],
    ];
    const nomes = [...new Set(painel.projetos.flatMap((p) => p._pessoas))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    const tipos = [...new Set(painel.projetos.map((p) => p.tipo))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    return `
      <div class="filtros" role="search">
        <label class="busca">
          <span class="oculto-visual">Buscar projeto, etapa ou pessoa</span>
          ${ICONES.busca}
          <input type="search" id="busca" placeholder="Buscar empresa, etapa ou pessoa…" autocomplete="off">
        </label>
        <div class="chips" role="group" aria-label="Situação">
          ${opcoesStatus.map(([valor, rotulo, n]) => `<button type="button" class="chip" data-acao="status" data-valor="${valor}" aria-pressed="false">${rotulo}<span class="qtd num">${n}</span></button>`).join('')}
        </div>
        <div class="selects">
          <select data-filtro="pessoa" aria-label="Responsável">
            <option value="">Todos os responsáveis</option>
            <option value="__sem__">Sem responsável</option>
            ${nomes.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}
          </select>
          <select data-filtro="fase" aria-label="Fase">
            <option value="">Todas as fases</option>
            ${painel.fases.map((f) => `<option value="${esc(f.id)}">${esc(f.nome)}</option>`).join('')}
          </select>
          <select data-filtro="tipo" aria-label="Tipo de projeto">
            <option value="">Todos os tipos</option>
            ${tipos.map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join('')}
          </select>
          <button type="button" class="limpar" data-acao="limpar" hidden>Limpar filtros</button>
        </div>
      </div>`;
  }

  function cabecalhoLista() {
    const col = (campo, rotulo) => {
      const ativo = tela.ordem.campo === campo;
      const sort = ativo ? (tela.ordem.direcao === 'desc' ? 'descending' : 'ascending') : 'none';
      return `<button type="button" data-acao="ordenar" data-campo="${campo}" aria-sort="${sort}">${rotulo}</button>`;
    };
    return `
      <div class="lista-cabecalho">
        ${col('empresa', 'Empresa')}
        <span>Etapa atual</span>
        <span>Com quem</span>
        ${col('parado', 'Parado há')}
        <span>Próximo passo</span>
        ${col('entrada', 'Entrada')}
        ${col('progresso', 'Progresso')}
      </div>`;
  }

  function linhaProjeto(p) {
    const a = p._atual;
    const principal = p._principal;
    const pct = p.progresso.total ? Math.round((p.progresso.feitas / p.progresso.total) * 100) : 0;
    return `
      <button type="button" class="linha st-${p.status}" data-acao="abrir" data-id="${esc(p.id)}">
        <span class="c-empresa">
          <strong>${esc(p.empresa)}</strong>
          <span class="meta">${esc(p.tipo)}${p.frentes.length > 1 ? ` · ${plural(p.frentes.length, 'frente', 'frentes')}` : ''}</span>
        </span>
        <span class="c-etapa">
          <span class="nome-etapa">${esc(a?.nome ?? 'Todas as etapas concluídas')}</span>
          ${a ? `<span class="etiquetas">${etiquetaEstado(a.estado)}<span class="etiqueta">${esc(nomeDaFase(a.fase))}</span></span>` : ''}
        </span>
        <span class="c-quem">${a ? avatares(a.responsaveis) : '—'}</span>
        <span class="c-parado">${a ? selo(p.status, a.diasParado) : pilula('concluido')}</span>
        <span class="c-proximo"><span class="rot-mobile">Próximo:</span>${principal?.proximo ? esc(principal.proximo.nome) : `<span class="meta">${a ? 'Última etapa' : '—'}</span>`}</span>
        <span class="c-entrada"><span class="rot-mobile">Entrada:</span><span class="num">${data(p.entrada)}</span><span class="meta">${ha(p.diasDesdeEntrada)}</span></span>
        <span class="c-progresso">
          <span class="medidor" data-dica="${p.progresso.feitas} de ${p.progresso.total} etapas concluídas">
            <span class="medidor-trilho"><span class="medidor-preenchido" style="width:${pct}%"></span></span>
            <span class="num">${pct}%</span>
          </span>
        </span>
      </button>`;
  }

  // ---------- Detalhe (gaveta lateral) ----------

  function blocoFrente(f, unica) {
    const a = f.atual;
    const trilha = f.etapas
      .map((e, i) => `<span class="passo ${e.estado} ${a && i === a.indice ? 'atual' : ''}" data-dica="${i + 1}. ${esc(e.nome)} — ${esc(ESTADOS[e.estado])}"></span>`)
      .join('');

    let atualHtml = '<p class="meta">Todas as etapas desta frente foram concluídas.</p>';
    if (a) {
      const subs = a.subtarefasAbertas.length
        ? `<div class="subtarefas"><h5>Subtarefas em aberto · ${a.subtarefasAbertas.length} de ${a.subtarefasTotal}</h5><ul>${a.subtarefasAbertas
            .slice(0, 6)
            .map((s) => `<li>${esc(s.nome)}<span class="meta">${esc(s.rotulo || 'sem status')}${s.responsaveis.length ? ` · ${esc(s.responsaveis.map(nomeCurto).join(', '))}` : ''}</span></li>`)
            .join('')}${a.subtarefasAbertas.length > 6 ? `<li class="meta">+ ${a.subtarefasAbertas.length - 6} outras</li>` : ''}</ul></div>`
        : '';
      const comentario = a.ultimoComentario
        ? `<blockquote class="comentario"><p>${esc(a.ultimoComentario.texto)}</p><footer>${esc(a.ultimoComentario.autor)} · ${data(a.ultimoComentario.data)}</footer></blockquote>`
        : '';
      atualHtml = `
        <div class="etapa-atual">
          <div class="etapa-atual-topo"><strong>${esc(a.nome)}</strong>${etiquetaEstado(a.estado)}</div>
          <p class="meta">${a.estado === 'pendente' ? 'Aguardando desde' : 'Nesta situação desde'} ${data(a.desde)} · última atividade ${ha(a.diasParado)}</p>
          <div class="pessoas-inline">${listaPessoas(a.responsaveis)}</div>
        </div>
        ${comentario}${subs}`;
    }

    const outras = f.outrasAbertas.length
      ? `<div class="outras"><h5>Outras etapas abertas</h5><ul>${f.outrasAbertas
          .map((o) => `<li>${esc(o.nome)}<span class="meta">${esc(ESTADOS[o.estado])} · sem atualização ${ha(o.diasParado)}</span></li>`)
          .join('')}</ul></div>`
      : '';

    return `
      <section class="frente">
        ${unica ? '' : `<header class="frente-cabecalho"><h4>${esc(f.nome || 'Etapas')}</h4>${pilula(f.status)}</header>`}
        <div class="trilha-rotulo"><span>Etapas</span><span class="num">${f.progresso.feitas}/${f.progresso.total} concluídas</span></div>
        <div class="trilha" aria-label="Etapas da frente">${trilha}</div>
        ${atualHtml}
        ${f.proximo ? `<div class="proximo">${ICONES.seta}<div><span class="meta">Próximo passo</span><strong>${esc(f.proximo.nome)}</strong>${f.proximo.responsaveis.length ? `<span class="meta">com ${esc(f.proximo.responsaveis.map(nomeCurto).join(', '))}</span>` : ''}</div></div>` : ''}
        ${outras}
      </section>`;
  }

  function gaveta(p) {
    const a = p._atual;
    const abertas = p.frentes
      .filter((f) => f.situacao !== 'concluida')
      .sort((x, y) => (y.id === p.frentePrincipal) - (x.id === p.frentePrincipal) || STATUS[x.status].ordem - STATUS[y.status].ordem || (y.atual?.diasParado ?? 0) - (x.atual?.diasParado ?? 0));
    const concluidas = p.frentes.filter((f) => f.situacao === 'concluida');
    const unica = p.frentes.length === 1;
    const pct = p.progresso.total ? Math.round((p.progresso.feitas / p.progresso.total) * 100) : 0;
    return `
      <div class="veu" data-acao="fechar"></div>
      <aside class="gaveta" role="dialog" aria-modal="true" aria-labelledby="gaveta-titulo">
        <header class="gaveta-topo st-${p.status}">
          <div>
            ${pilula(p.status)}
            <h2 id="gaveta-titulo">${esc(p.empresa)}</h2>
            <p>${esc(p.tipo)} · entrou em ${data(p.entrada)} (${ha(p.diasDesdeEntrada)})</p>
          </div>
          <button type="button" class="fechar" data-acao="fechar" aria-label="Fechar">${ICONES.fechar}</button>
        </header>
        <div class="gaveta-corpo">
          <div class="resumo">
            <div class="st-${p.status}"><span>Parado há</span><strong class="num">${a ? dias(a.diasParado) : '—'}</strong></div>
            <div><span>Progresso</span><strong class="num">${pct}%</strong></div>
            <div><span>Última movimentação</span><strong>${dataCurta(p.ultimaMovimentacao)}</strong></div>
          </div>
          ${p.alertas.length ? `<div class="alertas">${p.alertas.map((al) => `<span>${ICONES.aviso}${esc(al.texto)}</span>`).join('')}</div>` : ''}
          ${abertas.map((f) => blocoFrente(f, unica)).join('')}
          ${!abertas.length ? concluidas.map((f) => blocoFrente(f, unica)).join('') : concluidas.length ? `<p class="concluidas">${ICONES.concluido}${plural(concluidas.length, 'frente concluída', 'frentes concluídas')}: ${concluidas.map((f) => esc(f.nome)).join(' · ')}</p>` : ''}
          ${/^https:\/\//.test(p.url ?? '') ? `<a class="botao-monday" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Abrir quadro no Monday ${ICONES.externo}</a>` : ''}
        </div>
      </aside>`;
  }

  function abrirGaveta(id) {
    const p = projetoPorId(id);
    if (!p) return;
    tela.aberto = id;
    const alvo = document.getElementById('camada');
    alvo.innerHTML = gaveta(p);
    document.body.classList.add('com-gaveta');
    requestAnimationFrame(() => alvo.classList.add('visivel'));
    alvo.querySelector('.fechar')?.focus();
  }

  function fecharGaveta() {
    const alvo = document.getElementById('camada');
    alvo.classList.remove('visivel');
    document.body.classList.remove('com-gaveta');
    const id = tela.aberto;
    tela.aberto = null;
    setTimeout(() => { if (!tela.aberto) alvo.innerHTML = ''; }, 250);
    if (id) app.querySelector(`[data-acao="abrir"][data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
  }

  // ---------- Renderização ----------

  function renderizarDinamico() {
    const f = tela.filtro;
    const painel = tela.painel;
    document.getElementById('kpis').outerHTML = kpis(painel);
    document.getElementById('esteira').outerHTML = esteira(painel);
    document.getElementById('bloco-pessoas').innerHTML = pessoas(painel);

    for (const chip of app.querySelectorAll('.chip[data-acao="status"]')) chip.setAttribute('aria-pressed', String(chip.dataset.valor === f.status));
    for (const sel of app.querySelectorAll('select[data-filtro]')) sel.value = f[sel.dataset.filtro];
    app.querySelector('[data-acao="limpar"]').hidden = !filtroAtivo();

    const resumo = document.getElementById('resumo-filtro');
    resumo.hidden = !filtroAtivo();
    resumo.innerHTML = filtroAtivo() ? `Filtro aplicado à esteira e à lista · <button type="button" data-acao="limpar">limpar</button>` : '';

    const lista = ordenar(filtrar(painel.projetos));
    document.getElementById('contagem').textContent = plural(lista.length, 'projeto', 'projetos');
    document.getElementById('lista').innerHTML = cabecalhoLista() + (lista.length ? lista.map(linhaProjeto).join('') : '<p class="vazio">Nenhum projeto com esses filtros.</p>');
  }

  function iniciarPainel(painel) {
    prepararProjetos(painel);
    tela.painel = painel;
    document.title = `${painel.titulo || 'Projetos Fiscais'} · Painel executivo`;
    app.innerHTML = `
      <div class="folha">
      ${cabecalho(painel)}
      <main>
        ${avisoDesatualizado(painel)}
        <section class="secao">
          <div class="secao-cabecalho">
            <div><h2>Esteira dos projetos</h2><p>Em que fase está cada projeto ativo · clique num card para ver os detalhes</p></div>
            <p class="resumo-filtro" id="resumo-filtro" hidden></p>
          </div>
          ${esteira(painel)}
        </section>
        <div class="grade-2">
          ${gargalos(painel)}
          <div id="bloco-pessoas">${pessoas(painel)}</div>
        </div>
        <section class="secao" id="projetos">
          <div class="secao-cabecalho">
            <div><h2>Todos os projetos</h2><p>Lista completa com filtros · <span id="contagem"></span></p></div>
          </div>
          <div class="lista-cartao">
            ${barraDeFiltros(painel)}
            <div class="lista" id="lista"></div>
          </div>
        </section>
        <div class="grade-2">
          ${entradasPorMes(painel)}
          ${comoLer(painel)}
        </div>
        <p class="rodape">Fonte: Monday · workspace TAX - Consultivo · atualização automática</p>
      </main>
      </div>
      <div id="camada" class="camada"></div>`;
    ligarEventos();
    renderizarDinamico();
  }

  // ---------- Eventos ----------

  function executar(acao, el) {
    const f = tela.filtro;
    switch (acao) {
      case 'status':
        f.status = f.status === el.dataset.valor && el.dataset.valor !== 'ativos' ? 'ativos' : el.dataset.valor;
        if (el.classList.contains('kpi')) f.pessoa = '';
        break;
      case 'pessoa':
        f.pessoa = f.pessoa === el.dataset.valor ? '' : el.dataset.valor;
        if (f.pessoa && f.status !== 'ativos' && f.status !== 'todos') f.status = 'ativos';
        break;
      case 'limpar':
        Object.assign(f, { status: 'ativos', busca: '', pessoa: '', fase: '', tipo: '' });
        document.getElementById('busca').value = '';
        break;
      case 'ordenar': {
        const campo = el.dataset.campo;
        tela.ordem =
          tela.ordem.campo === campo
            ? { campo, direcao: tela.ordem.direcao === 'desc' ? 'asc' : 'desc' }
            : { campo, direcao: campo === 'empresa' || campo === 'entrada' ? 'asc' : 'desc' };
        break;
      }
      case 'abrir':
        abrirGaveta(el.dataset.id);
        return;
      case 'fechar':
        fecharGaveta();
        return;
      case 'tema': {
        const proximo = TEMAS[(TEMAS.indexOf(temaAtual()) + 1) % TEMAS.length];
        guardar.gravar('localStorage', CHAVE_TEMA, proximo);
        aplicarTema(proximo);
        el.querySelector('span').textContent = NOME_TEMA[proximo];
        return;
      }
      case 'sair':
        sair();
        return;
      default:
        return;
    }
    renderizarDinamico();
  }

  function ligarEventos() {
    document.addEventListener('click', (ev) => {
      if (ev.target.closest('a')) return;
      const el = ev.target.closest('[data-acao]');
      if (el && !el.disabled) executar(el.dataset.acao, el);
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && tela.aberto) fecharGaveta();
    });
    app.addEventListener('change', (ev) => {
      const sel = ev.target.closest('select[data-filtro]');
      if (!sel) return;
      tela.filtro[sel.dataset.filtro] = sel.value;
      if (sel.value && tela.filtro.status === 'concluido' && sel.dataset.filtro !== 'tipo') tela.filtro.status = 'ativos';
      renderizarDinamico();
    });
    let espera;
    app.addEventListener('input', (ev) => {
      if (ev.target.id !== 'busca') return;
      clearTimeout(espera);
      espera = setTimeout(() => {
        tela.filtro.busca = ev.target.value;
        renderizarDinamico();
      }, 120);
    });
  }

  // Dica flutuante.
  function posicionarDica(x, y) {
    const margem = 12;
    const { width, height } = dica.getBoundingClientRect();
    let esquerda = x + margem;
    let topoDica = y + margem;
    if (esquerda + width > window.innerWidth - 8) esquerda = x - width - margem;
    if (topoDica + height > window.innerHeight - 8) topoDica = y - height - margem;
    dica.style.left = `${Math.max(8, esquerda)}px`;
    dica.style.top = `${Math.max(8, topoDica)}px`;
  }
  document.addEventListener('pointerover', (ev) => {
    const alvo = ev.target.closest?.('[data-dica]');
    if (!alvo) return;
    dica.textContent = alvo.dataset.dica;
    dica.hidden = false;
    posicionarDica(ev.clientX, ev.clientY);
  });
  document.addEventListener('pointermove', (ev) => {
    if (!dica.hidden) posicionarDica(ev.clientX, ev.clientY);
  });
  document.addEventListener('pointerout', (ev) => {
    const alvo = ev.target.closest?.('[data-dica]');
    if (alvo && !alvo.contains(ev.relatedTarget)) dica.hidden = true;
  });
  window.addEventListener('scroll', () => { dica.hidden = true; }, { passive: true, capture: true });

  // ---------- Início ----------

  async function iniciar() {
    aplicarTema(temaAtual());
    let conteudo;
    try {
      conteudo = JSON.parse(document.getElementById('dados').textContent);
    } catch {
      conteudo = null;
    }
    if (conteudo?.aberto) {
      tela.criptografado = false;
      iniciarPainel(conteudo.aberto);
      return;
    }
    if (!conteudo?.cifrado) {
      app.innerHTML = '<p class="vazio">Painel sem dados. Execute a atualização (GitHub Actions) para publicar os dados.</p>';
      return;
    }
    tela.criptografado = true;
    const salva = guardar.ler('sessionStorage', CHAVE_SENHA) || guardar.ler('localStorage', CHAVE_SENHA);
    if (salva) {
      try {
        iniciarPainel(await abrirDados(conteudo.cifrado, salva));
        return;
      } catch {
        guardar.remover('sessionStorage', CHAVE_SENHA);
        guardar.remover('localStorage', CHAVE_SENHA);
      }
    }
    telaDeAcesso(conteudo.cifrado);
  }

  iniciar();
})();
</script>
</body>
</html>
